name: Prototype regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip pytest hypothesis numpy scipy sympy cryptography
      - run: bash scripts/run_validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-regression-evidence
          path: results/
